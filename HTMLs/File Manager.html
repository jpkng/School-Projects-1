<!DOCTYPE html>
<html>
<head>
<title>File Management System</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
margin:0;
padding:0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

.container{
width:80%;
margin:auto;
margin-top:30px;
}

.controls{
margin-bottom:20px;
}

button{
padding:8px 15px;
margin:5px;
border:none;
border-radius:5px;
background:#3498db;
color:white;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0px 0px 5px rgba(0,0,0,0.2);
}

th, td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

tr:hover{
background:#f2f2f2;
}

.selected{
background:#d0e8ff;
}

</style>
</head>

<body>

<header>
File Management Interface
</header>

<div class="container">

<div class="controls">

<button onclick="addFile()">Add File</button>
<button onclick="copyFile()">Copy</button>
<button onclick="renameFile()">Rename</button>
<button onclick="deleteFile()">Delete</button>

</div>

<table id="fileTable">
<thead>
<tr>
<th>Select</th>
<th>File Name</th>
</tr>
</thead>

<tbody id="fileList">

</tbody>

</table>

</div>

<script>

let files = [
"document.txt",
"photo.png",
"assignment.docx",
"music.mp3"
];

function renderFiles(){

let list = document.getElementById("fileList");
list.innerHTML="";

files.forEach((file,index)=>{

list.innerHTML += `
<tr>
<td><input type="radio" name="fileSelect" value="${index}"></td>
<td>${file}</td>
</tr>
`;

});

}

function getSelectedFile(){

let selected = document.querySelector('input[name="fileSelect"]:checked');

if(!selected){
alert("Please select a file.");
return null;
}

return selected.value;

}

function addFile(){

let name = prompt("Enter new file name:");

if(name){
files.push(name);
renderFiles();
alert("File added successfully.");
}

}

function copyFile(){

let index = getSelectedFile();

if(index===null) return;

let newName = files[index] + "_copy";

files.push(newName);

renderFiles();

alert("File copied successfully.");

}

function renameFile(){

let index = getSelectedFile();

if(index===null) return;

let newName = prompt("Enter new file name:",files[index]);

if(newName){

files[index] = newName;

renderFiles();

alert("File renamed successfully.");

}

}

function deleteFile(){

let index = getSelectedFile();

if(index===null) return;

let confirmDelete = confirm("Are you sure you want to delete this file?");

if(confirmDelete){

files.splice(index,1);

renderFiles();

alert("File deleted.");

}

}

renderFiles();

</script>

</body>
</html>
